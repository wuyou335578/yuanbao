<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans CJK SC",sans-serif}
body{width:360px;height:780px;background:#fff;overflow:hidden}
.logo{text-align:center;padding-top:100px}
.logo-box{width:80px;height:80px;margin:0 auto;background:#07C160;border-radius:14px;
  position:relative}
.logo-box::after{content:"";position:absolute;left:14px;top:22px;width:44px;height:34px;
  background:#fff;border-radius:8px}
.title{text-align:center;font-size:20px;color:#191919;margin-top:14px}
.sub{text-align:center;font-size:12px;color:#B2B2B2;margin-top:6px}
.field{display:block;border:none;outline:none;width:312px;height:48px;margin:18px auto 0;background:#EDEDED;border-radius:4px;
  padding-left:16px;font-size:16px;color:#B2B2B2;line-height:48px}
.btn{width:312px;height:48px;margin:24px auto 0;background:#07C160;border-radius:4px;
  color:#fff;font-size:16px;text-align:center;line-height:48px}
.link{width:312px;margin:16px auto 0;text-align:center;font-size:14px;color:#576B95}
.foot{position:absolute;bottom:24px;width:360px;text-align:center;font-size:12px;color:#B2B2B2}
</style></head><body>
<div class="logo"><div class="logo-box"></div></div>
<div class="title">微信</div><div class="sub">单机娱乐版</div>
<input class="field" id="f1" placeholder="微信号/手机号/邮箱">
<input class="field" id="f2" type="password" placeholder="密码">
<div class="btn" id="login">登录</div>
<div class="link">用微信号/QQ号/邮箱登录</div>
<div class="foot">单机娱乐版 v1.0</div>
<script>
document.getElementById('login').addEventListener('click',function(){
  document.getElementById('login').style.background='#06AD56';
  document.querySelector('.title').textContent='登录成功';
});
</script></body></html>
